# Publishes a GitHub release when a version tag is pushed: git tag v1.0.1 && git push origin v1.0.1
# The tag must match <Version> in Directory.Build.props. The release is created as a draft so it can be
# reviewed (notes, signed binaries) before being published.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check that the tag matches the project version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $version in Directory.Build.props" }

      - name: Build, test and package
        shell: pwsh
        run: ./build/Build-Release.ps1

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem artifacts/installer -File | ForEach-Object FullName
          gh release create "${{ github.ref_name }}" @files --draft --title "Seekbeam ${{ github.ref_name }}" `
            --notes "See [docs/RELEASE_NOTES.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/RELEASE_NOTES.md). Verify downloads with SHA256SUMS.txt."
