# Build and test on every push to main and every pull request.
# The build fails on any banned file-write API outside SeekbeamStorage (BannedApiAnalyzers, RS0030 as error),
# and the test suite includes the IL immutability analysis and the SHA-256 integrity tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build (Release)
        run: dotnet build Seekbeam.sln -c Release

      # The integrity tests start the real Seekbeam.exe and Seekbeam.ExtractorHost.exe from bin\Debug.
      - name: Build (Debug)
        run: dotnet build Seekbeam.sln -c Debug

      - name: Test
        run: dotnet test Seekbeam.sln -c Debug --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          retention-days: 14

  package:
    name: Package (MSI and portable zip)
    runs-on: windows-latest
    needs: build-test
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build MSI and portable zip
        shell: pwsh
        run: ./build/Build-Release.ps1 -SkipTests

      - uses: actions/upload-artifact@v7
        with:
          name: seekbeam-packages
          path: artifacts/installer/*
          retention-days: 14
